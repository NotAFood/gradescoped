[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradescoped"
version = "0.1.0"
description = "Sync Gradescope assignments to Google Calendar"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
gradescoped = "gradescoped.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["gradescoped"]
